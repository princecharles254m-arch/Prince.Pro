name: Build PrincePro APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Extract PrincePro project
        run: |
          mkdir -p extracted
          unzip -o PrincePro_v1.0_complete.zip -d extracted

          echo "Searching for Flutter project..."

          PROJECT_DIR=$(find extracted -name pubspec.yaml -type f -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml was not found."
            find extracted -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "Flutter project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Upload PrincePro APK
        uses: actions/upload-artifact@v4
        with:
          name: PrincePro-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
