name: Build PrincePro APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Extract PrincePro project
        run: |
          mkdir -p extracted
          unzip -o PrincePro_v1.0_complete.zip -d extracted

          PROJECT_DIR=$(find extracted -name pubspec.yaml -type f -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          echo "Found PrincePro at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Create fresh Android project
        run: |
          mkdir princepro_build

          flutter create \
            --platforms=android \
            --project-name princepro \
            princepro_build

          echo "Fresh Flutter Android project created."

      - name: Copy PrincePro source
        run: |
          rm -rf princepro_build/lib
          cp -r "$PROJECT_DIR/lib" princepro_build/lib

          if [ -d "$PROJECT_DIR/assets" ]; then
            cp -r "$PROJECT_DIR/assets" princepro_build/assets
          fi

          cp "$PROJECT_DIR/pubspec.yaml" princepro_build/pubspec.yaml

          if [ -f "$PROJECT_DIR/analysis_options.yaml" ]; then
            cp "$PROJECT_DIR/analysis_options.yaml" princepro_build/analysis_options.yaml
          fi

      - name: Get dependencies
        working-directory: princepro_build
        run: flutter pub get

      - name: Build release APK
        working-directory: princepro_build
        run: flutter build apk --release

      - name: Upload PrincePro APK
        uses: actions/upload-artifact@v4
        with:
          name: PrincePro-APK
          path: princepro_build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
