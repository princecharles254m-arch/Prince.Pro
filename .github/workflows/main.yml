name: Build PrincePro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract PrincePro project
        run: |
          unzip -o PrincePro_v1.0_complete.zip -d princepro_source

      - name: Find Flutter project
        id: flutter_project
        run: |
          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/princepro_source" -name pubspec.yaml -type f -print -quit | xargs dirname)
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Flutter project found at: $PROJECT_DIR"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: ${{ steps.flutter_project.outputs.project_dir }}
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ steps.flutter_project.outputs.project_dir }}
        run: flutter build apk --release

      - name: Upload PrincePro APK
        uses: actions/upload-artifact@v4
        with:
          name: PrincePro-APK
          path: ${{ steps.flutter_project.outputs.project_dir }}/build/app/outputs/flutter-apk/app-release.apk
